<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Reservas Tenis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Sistema de Reservas de Canchas de Tenis</h1>

    <form>
        <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="usuario@correo.com">
        </div>

        <div class="form-group">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" placeholder="********">
        </div>

        <!-- Mensajes de ejemplo para el prototipo -->
        <div class="message error">
            Usuario o contraseña incorrectos.
        </div>
        <div class="message error">
            Su cuenta ha sido bloqueada por seguridad. Contacte al administrador.
        </div>

        <div class="actions">
            <!-- En prototipo usamos enlaces que simulan el flujo -->
            <a href="menu.html" class="btn-link">Iniciar sesión</a>
            <a href="registro.html" class="btn-link">Registrarme</a>
        </div>
    </form>
</div>
</body>
</html>
